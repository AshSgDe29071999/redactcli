name: "redactcli Secret Scan"
description: "Fail the job when high-signal secrets appear in the workspace or git diff. Local regex scan — no cloud, no API key."
author: "AshSgDe29071999"
branding:
  icon: "shield"
  color: "red"

inputs:
  paths:
    description: "Space-separated paths to scan (ignored when scan-mode is git-diff)"
    required: false
    default: "."
  scan-mode:
    description: "workspace (all matching files) or git-diff (changed files on the PR / push)"
    required: false
    default: "workspace"
  min-confidence:
    description: "Minimum pattern confidence: high or medium"
    required: false
    default: "medium"
  fail-on-findings:
    description: "Fail the step when secrets are found"
    required: false
    default: "true"
  python-version:
    description: "Python version for the runner"
    required: false
    default: "3.12"
  version:
    description: "redactcli version to install (default: latest from PyPI)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install redactcli
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${{ inputs.version }}" ]; then
          pip install "redactcli==${{ inputs.version }}"
        else
          pip install redactcli
        fi
        redactcli --version

    - name: Scan for secrets
      shell: bash
      run: |
        set -euo pipefail
        ARGS=(scan --min-confidence "${{ inputs.min-confidence }}" --json)
        if [ "${{ inputs.fail-on-findings }}" = "true" ]; then
          ARGS+=(--fail-on-findings)
        else
          ARGS+=(--no-fail-on-findings)
        fi

        collect_workspace() {
          # shellcheck disable=SC2206
          local PATHS=(${{ inputs.paths }})
          find "${PATHS[@]}" \
            \( -name .git -o -name .venv -o -name node_modules -o -name dist -o -name build -o -name .tox \) -prune -o \
            -type f \( \
              -name '*.py' -o -name '*.js' -o -name '*.ts' -o -name '*.tsx' -o -name '*.json' \
              -o -name '*.yml' -o -name '*.yaml' -o -name '*.env' -o -name '.env*' \
              -o -name '*.md' -o -name '*.toml' -o -name '*.sh' -o -name '*.tf' -o -name '*.txt' \
            \) -print 2>/dev/null | head -n 5000
        }

        collect_diff() {
          git rev-parse --is-inside-work-tree >/dev/null 2>&1 || {
            echo "scan-mode=git-diff requires a git checkout; falling back to workspace"
            collect_workspace
            return
          }
          local base="${{ github.event.pull_request.base.sha }}"
          if [ -n "$base" ]; then
            git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
            git diff --name-only --diff-filter=ACMRTUXB "$base"...HEAD
          else
            git diff --name-only --diff-filter=ACMRTUXB HEAD~1...HEAD 2>/dev/null || git ls-files
          fi
        }

        if [ "${{ inputs.scan-mode }}" = "git-diff" ]; then
          mapfile -t FILES < <(collect_diff)
        else
          mapfile -t FILES < <(collect_workspace)
        fi

        if [ "${#FILES[@]}" -eq 0 ]; then
          echo "No matching files to scan."
          exit 0
        fi

        set +e
        redactcli "${ARGS[@]}" "${FILES[@]}"
        code=$?
        set -e
        if [ "$code" -ne 0 ]; then
          echo "::error::redactcli found secrets (exit $code). See job log for findings."
          exit "$code"
        fi
