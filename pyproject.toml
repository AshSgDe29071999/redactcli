[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "redactcli"
version = "0.1.0"
description = "Redact secrets from agent output, logs, diffs, and CI — pipe-friendly CLI + GitHub Action"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "AshSgDe29071999" },
]
keywords = [
  "secrets",
  "redaction",
  "security",
  "cli",
  "ci",
  "agents",
  "github-actions",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
redactcli = "redactcli.cli:main"

[project.urls]
Homepage = "https://github.com/AshSgDe29071999/redactcli"
Repository = "https://github.com/AshSgDe29071999/redactcli"
Issues = "https://github.com/AshSgDe29071999/redactcli/issues"
Changelog = "https://github.com/AshSgDe29071999/redactcli/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/redactcli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
