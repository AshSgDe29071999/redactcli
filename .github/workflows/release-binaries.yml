name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach binaries to (default: latest)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: redactcli-linux-x86_64
          - os: macos-13
            asset: redactcli-macos-x86_64
          - os: macos-latest
            asset: redactcli-macos-arm64
          - os: windows-latest
            asset: redactcli-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build one-file binary
        shell: bash
        run: |
          set -euo pipefail
          python -m PyInstaller \
            --onefile \
            --name redactcli \
            --paths src \
            --hidden-import redactcli \
            --hidden-import redactcli.cli \
            --hidden-import redactcli.engine \
            --hidden-import redactcli.patterns \
            src/redactcli/__main__.py
          if [ -f dist/redactcli.exe ]; then
            mv dist/redactcli.exe "dist/${{ matrix.asset }}"
          else
            mv dist/redactcli "dist/${{ matrix.asset }}"
          fi
          ls -lh "dist/${{ matrix.asset }}"
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.asset }}"
          "$BIN" --version
          # Assemble the fixture at runtime so this workflow file is not itself a finding.
          printf 'token=ghp_%s\n' "$(python -c 'print("A"*36)')" | "$BIN" | grep -q REDACTED
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          gh release upload "$TAG" "dist/${{ matrix.asset }}" --clobber
