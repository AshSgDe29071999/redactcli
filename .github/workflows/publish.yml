name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Skip if this version is already on PyPI
        id: pypi
        run: |
          set -euo pipefail
          local="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          remote="$(curl -fsSL https://pypi.org/pypi/redactcli/json | python -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])')"
          echo "local=$local remote=$remote"
          if [ "$local" = "$remote" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish (Trusted Publisher or token)
        if: steps.pypi.outputs.skip != 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install twine
          if [ -n "${TWINE_PASSWORD:-}" ]; then
            twine upload dist/*
          else
            # Preferred: configure Trusted Publisher for this workflow on pypi.org
            pip install id
            twine upload --non-interactive dist/* || {
              echo "Set PYPI_API_TOKEN secret or configure Trusted Publishing"
              exit 1
            }
          fi
