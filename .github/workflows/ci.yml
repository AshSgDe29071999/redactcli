name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest -q

  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local package
        run: pip install -e .
      - name: Scan repository for secrets
        run: |
          mapfile -t FILES < <(
            find . \
              \( -name .git -o -name .venv -o -name dist -o -name build -o -name tests \) -prune -o \
              -type f \( -name '*.py' -o -name '*.yml' -o -name '*.md' -o -name '*.toml' \) \
              ! -name README.md \
              -print
          )
          redactcli scan --min-confidence high "${FILES[@]}"
